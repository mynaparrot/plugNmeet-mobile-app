name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'PnmNativeAndroidDemo/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: PnmNativeAndroidDemo

      - name: Rename APK
        run: mv PnmNativeAndroidDemo/app/build/outputs/apk/debug/app-debug.apk PnmNativeAndroidDemo/app/build/outputs/apk/debug/plugnmeet-demo-debug.apk

      - name: Release APK
        run: |
          git tag -f latest
          git push origin latest --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Debug Build
          body: Auto-built APK from latest push to main.
          files: PnmNativeAndroidDemo/app/build/outputs/apk/debug/*.apk
          prerelease: true
